pluginManagement {
    repositories {
        gradlePluginPortal()
        mavenCentral()
        exclusiveContent {
            forRepository {
                maven {
                    name = 'Fabric'
                    url = uri('https://maven.fabricmc.net')
                }
            }
            filter {
                includeGroupAndSubgroups('net.fabricmc')
            }
        }
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

// This should match the folder name of the project, or else IDEA may complain (see https://youtrack.jetbrains.com/issue/IDEA-317606)
rootProject.name = 'Numen'
// 三兄弟布局:core/(模组本体)、api/(引擎,曾是独立仓)、ai/(LLM 连接层,纯 JVM)。
// 单一构建:core 直接以 project 依赖消费 api,api 消费 ai,不经 maven 中转。
include('core:common')
include('core:fabric')
include('core:neoforge')
include('api:common')
include('api:fabric')
include('api:neoforge')
// numen-ai:LLM 连接层,纯 JVM、与 MC 版本无关(详见 ai/build.gradle 头注)。
include('ai')
include('ui')
// Independent host-agnostic RDD task-chain core (no Minecraft/NUMEN dependency).
include('rdd-core')
// Independent host-agnostic experience memory core (no Minecraft/NUMEN dependency).
include('experience-core')
// Independent host-agnostic settlement core (no Minecraft/NUMEN dependency): modular
// base grid + facility registry + location-based protection rules + three-layer
// acceptance. Pure JVM so its JUnit suite runs here -- plugin unit tests cannot run
// (they lack the whole Minecraft test runtime, see AGENTS 第 2 条).
include('settlement-core')

// 联动模块:一个联动一个,各自独立,内嵌发布不单独发坐标。见 buildSrc 的 numen-plugin.gradle
include('plugins:ysm')
include('plugins:tlm')
include('plugins:selfcompile')
include('plugins:rdd')
include('plugins:experience')
// 第一代 AC（plugins:ac + ac-api + ac-core）已于 2026-10-08 删除：
// 当年源码在但 jar 从未部署，且与 ACX 两代并存。ACX 是从零重写，不 import 旧代。
// ACX：AC 执行层新代（非线性控制流/前置条件/参数映射/生命周期），随插件独立部署。
include('plugins:acx')
// numencam：客户端相机模块（2026-10-04 新增）。从 api/common 的 client 源码集搬出来的
// CameraRig + MixinCamera 现在归它，外加游戏内 /cam 指令、绑定+自动传送、移动加速、录像。
// 它**不**注册进 NumenPlugins、也不依赖 api jar —— 只依赖 Minecraft 客户端 + NeoForge。
include('plugins:camera')
// 2026-10-01 第二批第 0 步：从 tag batch2-learner-20260929 恢复 learner 到主干。
// 之前这段 include 只存在于悬空 commit 1054f153（不在 redline-1 祖先链），导致 learner 模块
// 在主干上从未被构建，那 25 项测试一项都不跑 —— 30 号文档记的「752 tests / 新增 25」是失效证据。
include('plugins:learner')
// settlement：基地与设施模块（2026-10-08 新增）。登记真源落 config/numen/settlement/，
// 独立于 128 条世界资产上限；纯逻辑内嵌 settlement-core。
include('plugins:settlement')
