plugins { id 'java-library' }

group = 'com.dwinovo.numen'
java { toolchain.languageVersion = JavaLanguageVersion.of(java_version) }

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }

repositories { mavenCentral() }

dependencies {
    implementation 'com.google.code.gson:gson:2.10.1'
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
    // P1-C managed offline test window (2026-11-11): isolate this attempt's XML.
    if (System.getenv('RDD_TEST_REPORT_DIR')) {
        reports.junitXml.outputLocation = file(System.getenv('RDD_TEST_REPORT_DIR'))
    }
    // 依赖门在生产里按用户决定(2026-09-27)默认关闭，但**拦截能力本身必须持续被验证**，
    // 否则"关门"会悄悄退化成"删能力"。所以单测一律把门打开跑历史契约。
    systemProperty 'rdd.dependencyGate', 'true'
}
