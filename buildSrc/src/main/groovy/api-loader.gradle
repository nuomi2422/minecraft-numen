plugins {
    id 'api-common'
}

configurations {
    commonJava{
        canBeResolved = true
    }
    commonClientJava{
        canBeResolved = true
    }
    commonResources{
        canBeResolved = true
    }
}

dependencies {
    // 消费面契约:NumenTool 继承 ai 的 IToolSpec,编译期消费者(如 core 的
    // loader 模块)需要看见 ai 的类型。发行 jar 已把 ai 的类平铺进来(见下方
    // jar 块),运行时自含,这条声明只服务编译期与 pom 的如实陈述。
    api project(':ai')
    // UI 组件库(纯 JVM)同理:屏幕组装层引用 widget/令牌类型,编译期要看得见;
    // 发行 jar 里的类由下方 jar 块平铺进来。
    api project(':ui')
    compileOnly(project(':api:common')) {
        def loaderAttribute = Attribute.of('io.github.mcgradleconventions.loader', String)
        attributes {
            attribute(loaderAttribute, 'common')
        }
    }
    commonJava project(path: ':api:common', configuration: 'commonJava')
    commonClientJava project(path: ':api:common', configuration: 'commonClientJava')
    commonResources project(path: ':api:common', configuration: 'commonResources')
}

// 加载器把 common 的主源码与客户端源码一起编进自己的 jar:分源码集的
// 保护发生在 common 的编译期(主源码集看不见客户端类),发行 jar 照旧
// 全量——服务端不会去加载客户端类,因为主源码集里已经没有任何引用。
tasks.named('compileJava', JavaCompile) {
    dependsOn(configurations.commonJava)
    source(configurations.commonJava)
    dependsOn(configurations.commonClientJava)
    source(configurations.commonClientJava)
}

// Ordinary clean jars need language JSON too. Compile only the pure catalogue and thin exporter;
// using runData here would cycle through its own runtime processResources/classpath.
def languageCatalogue = rootProject.file('api/common/src/main/java/com/dwinovo/numen/data/ModLanguageData.java')
def languageEmitter = rootProject.file('tools/api-language/com/dwinovo/numen/buildtools/ApiLanguageExport.java')
def languageResources = layout.buildDirectory.dir('generated/api-language/resources')
def languagePaths = ['assets/numen_api/lang/en_us.json', 'assets/numen_api/lang/zh_cn.json']
def compileApiLanguage = tasks.register('compileApiLanguageExporter', JavaCompile) {
    source(languageCatalogue, languageEmitter)
    classpath = files()
    destinationDirectory = layout.buildDirectory.dir('generated/api-language/classes')
    options.encoding = 'UTF-8'
    javaCompiler = javaToolchains.compilerFor { languageVersion = JavaLanguageVersion.of(java_version) }
}
def exportApiLanguage = tasks.register('generateApiLanguageResources', JavaExec) {
    dependsOn(compileApiLanguage)
    classpath = files(compileApiLanguage.flatMap { it.destinationDirectory })
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(java_version) }
    mainClass = 'com.dwinovo.numen.buildtools.ApiLanguageExport'
    args(languageResources.get().asFile.absolutePath)
    inputs.files(languageCatalogue, languageEmitter)
    outputs.dir(languageResources)
}
// Old optional MC datagen outputs must not compete with the catalogue-derived pair below.
sourceSets.main.resources.exclude(languagePaths)
processResources {
    dependsOn(configurations.commonResources, exportApiLanguage)
    from(configurations.commonResources) { exclude(languagePaths) }
    from(languageResources)
}

tasks.named('javadoc', Javadoc).configure {
    dependsOn(configurations.commonJava)
    source(configurations.commonJava)
    dependsOn(configurations.commonClientJava)
    source(configurations.commonClientJava)
}

tasks.named('sourcesJar', Jar) {
    dependsOn(exportApiLanguage)
    from(languageResources)
    from(languageEmitter) { into 'build-tools/api-language' }
    dependsOn(configurations.commonJava)
    from(configurations.commonJava)
    dependsOn(configurations.commonClientJava)
    from(configurations.commonClientJava)
    dependsOn(configurations.commonResources)
    from(configurations.commonResources) { exclude(languagePaths) }
    from({ project(':ai').sourceSets.main.allSource })
    from({ project(':ui').sourceSets.main.allSource })
}

// numen-ai 的类平铺进加载器发行 jar——http/prompt 从 common 源码集迁去 ai
// 模块后,加载器不再从源码把它们编进来,这里补回,发行 jar 内容与拆分前一致。
tasks.named('jar', Jar) {
    from({ project(':ai').sourceSets.main.output })
    from({ project(':ui').sourceSets.main.output })
}
