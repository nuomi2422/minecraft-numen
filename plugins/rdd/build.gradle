plugins { id 'numen-plugin' }

// UTF-8 源码编码由 numen-plugin 约定统一设置（buildSrc/src/main/groovy/numen-plugin.gradle），
// 这里不再重复声明 —— 两处各写一遍时，改约定会漏改一处（037/T8a，2026-11-04）。

processResources {
    def props = [
            version                       : project.version,
            license                       : license,
            neoforge_loader_version_range : neoforge_loader_version_range,
            neoforge_version              : neoforge_version,
            minecraft_version_range       : minecraft_version_range
    ]
    inputs.properties props
    filesMatching('META-INF/neoforge.mods.toml') {
        expand props
    }
}

dependencies {
    // RDD 核心已独立为 rdd-core 模块；本插件只内嵌 rdd-core，不内嵌任何 AC 核心
    // （第一代 plugins/ac + ac-api + ac-core 已于 2026-10-08 删除，AC 执行层现为 plugins:acx）。
    // 不内嵌共享 core 是为了避免同装时出现重复包（历史 JPMS ResolutionException）。
    implementation project(':rdd-core')
    // 2026-11-04（037/T8b 收尾）：**不再依赖 core:common**。
    //   原用途两条都已换成公开面：
    //   ①容器存货原来 new core 内部工具 QueryExtraOps → 现走 api 的 ContainerReader；
    //   ②日志原来借 core Constants.LOG → 现用插件自己的 slf4j logger。
    //   删掉这条依赖意味着"RDD 插件不再看 core 的内部类型"，将来谁想加回来，编译期就会挡住他。
    // 2026-10-29（revive）：复活通道要用 entity 包（CompanionFactory/CompanionRegistry），
    //   它们只在 api:common 里；本插件原本只看到 core:common，所以显式补一条 compileOnly（不内嵌）。
    compileOnly project(':api:common')
    // RddDecomposer / RddSubmitTool / RddDetector 用 Gson。
    implementation 'com.google.code.gson:gson:2.10.1'
    // 纯 JVM 容错解析(RddDecomposer.parse)需要 ai 模块的 IToolSpec 参与类加载。
    testImplementation project(':ai')
    // 2026-11-05（042 R2）：接线测试要构造 api 的 Status/Coverage/Item 跑 assess(status, coverage, items)。
    // 主源集经 numen-plugin 约定拿到 api（compileOnly）；测试源集不吃那套约定，必须显式声明。
    testImplementation project(':api:common')
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test { useJUnitPlatform() }

// The numen-plugin convention exposes host APIs as compileOnly. RDD's own
// runtime must travel with the standalone plugin, otherwise RddRuntime would
// only work in a development classpath and fail when invoked in a real game.
tasks.named('jar', Jar) {
    dependsOn(':rdd-core:jar')
    from({ project(':rdd-core').sourceSets.main.output })
}
