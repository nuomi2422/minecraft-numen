plugins { id 'numen-plugin' }

// 中文注释必须有：PS 5.1 / javac 默认按平台编码读源码，少这行会乱码甚至编译失败
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }

processResources {
    def props = [
            version                       : project.version,
            license                       : license,
            neoforge_loader_version_range : neoforge_loader_version_range,
            neoforge_version              : neoforge_version,
            minecraft_version_range       : minecraft_version_range
    ]
    inputs.properties props
    filesMatching('META-INF/neoforge.mods.toml') {
        expand props
    }
}

dependencies {
    // 学习者不需要内嵌任何 core：不依赖 experience-core（那会与 plugins/experience 撞重复包），
    // 也不依赖 ac-core（历史上 rdd 内嵌 ac-core 直接撞 JPMS ResolutionException）。
    // 跨插件协作一律走 NumenApi 这扇门。
    // MemoQueue / Verdict / 备忘录工具都要 Gson；同 plugins/ac、plugins/rdd。
    // implementation（非 compileOnly）：队列要在运行时随插件走，否则进真游戏缺类。
    implementation 'com.google.code.gson:gson:2.10.1'
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    // 2026-10-01：CarrierChain / ItemSemantics 搬到 api:common（com.dwinovo.numen.api.carrier），
    // 因为 plugins/rdd 也要用同一份判断链 —— 跨插件 import 被 numen-plugin.gradle:37-44 封死，
    // 重建一份必然语义漂移。
    // ⚠️ 主编译靠 compileOnly 就够，但 **compileOnly 不会被 testCompileClasspath 继承**，
    //    所以测试要显式加 api jar，否则 CarrierChainTest 报「找不到 com.dwinovo.numen.api.carrier」。
    testImplementation files(project(':api:neoforge').tasks.named('apiJar'))
}

test { useJUnitPlatform() }
