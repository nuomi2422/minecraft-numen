plugins { id 'numen-plugin' }

processResources {
    def props = [
            version                       : project.version,
            license                       : license,
            neoforge_loader_version_range : neoforge_loader_version_range,
            neoforge_version              : neoforge_version,
            minecraft_version_range       : minecraft_version_range
    ]
    inputs.properties props
    filesMatching('META-INF/neoforge.mods.toml') {
        expand props
    }
}

dependencies {
    // Experience Memory 独立安装：把纯 JVM 核心内嵌进插件 jar，公共契约不含 NUMEN/MC 类型。
    implementation project(':experience-core')
}

// numen-plugin 约定只暴露宿主 API（compileOnly）。经验运行时必须随插件一起走，
// 否则只能在开发类路径里工作、进真游戏缺类。
tasks.named('jar', Jar) {
    dependsOn(':experience-core:jar')
    from({ project(':experience-core').sourceSets.main.output })
}
