plugins { id 'numen-plugin' }

processResources {
    def props = [
            version                       : project.version,
            license                       : license,
            neoforge_loader_version_range : neoforge_loader_version_range,
            neoforge_version              : neoforge_version,
            minecraft_version_range       : minecraft_version_range
    ]
    inputs.properties props
    filesMatching('META-INF/neoforge.mods.toml') {
        expand props
    }
}

dependencies {
    // ACX 本体（acx-api + acx-core 源码）在本模块内一起编译，无内嵌模块依赖。
    // 插件只经瘦 api jar 看 NUMEN（见 buildSrc 的 numen-plugin.gradle）。
    // gson 由 Minecraft 运行期自带的库提供，声明只为编译期解析。
    implementation 'com.google.code.gson:gson:2.10.1'

    // ★ 2026-10-03 收口：ACX 原来**一个 JUnit 测试都没有**（那 206 项是 main() 手工台），
    //   于是 :plugins:acx:test 因「有测试源码但一个都没发现」而一直失败。
    //   现在用 AcxOfflineSuiteTest 把那 206 项接成真门禁，所以必须引 JUnit。
    //   版本与其它模块一致（junit-bom 5.11.4），避免多套 JUnit 版本在同一个构建里打架。
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// ---------------------------------------------------------------------------
// ACX offline self-check (migrated 2026-10-03 from the ac-upgrade fork).
// acx/api + acx/core are Minecraft-free, so the suite runs on a plain JDK with
// only gson on the classpath - no gradle, no game, no devlaunch.
//
// NOTE: 5 of the 209 checks are deliberately RED. Two of them come from
// AcxTestMain.ctrlSnapshot(), which documents an unfixed bug (for-loop across
// a breakpoint cannot see $scan.matches on resume) and says so in a
// TODO(AC-B12) comment. The third one is the 2026-10-03 hardening regression
// "恢复不能重复发已受理的动作 (TODO AC-B18)": a step that was *accepted* (async,
// still running in the world) does not advance completedStepIndex -- AcxRunner
// only calls markStepCompleted on isSuccess() and returns early on PAUSED --
// so resume() restarts at that same step and **re-sends the accepted action**.
// Measured, not guessed: Fake.calls.count("gate") == 2 where it should be 1.
// That is the "会不会重复挖、重复走" risk in its most concrete form.
//
// The fourth is "取消后迟到的成功回执不得把这次运行翻回成功 (TODO AC-B19)".
// The cancel flag is only consulted in checkCircuit(), which runs *before*
// each step. If the host cancels while the LAST step is in flight and that
// step then reports success, the loop exits normally and runFrame() returns
// AcxStepOutcome.success(...) with no further cancel check (AcxRunner:350-352,
// and nothing after it either) -- the run reports SUCCESS. Measured:
// 期望 <PAUSED> 实际 <SUCCESS>.
//
// ★ Why only the last step leaks: with an outer while/if the *next* iteration
//   calls checkCircuit() again and catches it. That is why the pre-existing
//   test "取消是协作式的" passes -- it was rescued by the surrounding loop, not
//   by the main loop's own guarantee.
//
// ★ Second-order consequence, worse than the status being wrong: AcxRunner:180
//   feeds SUCCESS runs into experienceSink.onSuccess(...). A cancelled run that
//   reports SUCCESS therefore gets recorded as a successful experience sample,
//   i.e. it pollutes the very evidence chain we are trying to keep honest.
//
// The fifth is "「动作已受理、还在世界里跑」不许被记成 STEP_FAILED (TODO AC-B20)"
// -- the 69-doc group-1 red line "脚本在等 ≠ 身体动作已停" (a waiting script does not
// mean the body stopped). AcxRunner:567-572 emits STEP_FAILED for EVERY non-success
// outcome of a linear step, PAUSED included, and its detail carries only
// reason + elapsed_ms -- the task_id / _accepted / _completed that
// PortToolAdapter.acceptedOutput produced are dropped. So "she is walking there"
// is logged as "this step failed", and the in-flight task id survives only as text
// inside `reason` ("...后台执行中: taskId=t1"), unreadable by machine.
// MEASURED on the live instance (config/numen/monitor/acx.jsonl, 2539 lines):
//   STEP_FAILED|PAUSED = 53   <- actions still in flight, logged as failures
//   STEP_FAILED|FAIL   = 29   <- real failures
//   STEP_PAUSED|PAUSED =  1   <- the only kind actually meant for "waiting"
// i.e. counting failures by `kind` counts more fakes than real ones (53 vs 29),
// and the monitoring station's ACX page shows exactly that wrong number.
// ★ Note why the earlier async tests missed it: they only assert
//   AcxRunRecord.status(), which IS correct (PAUSED). The record was right and the
//   LOG was wrong -- and a wrong log is harder to notice than a wrong record.
//
// We keep the gate honest by asserting the failure count is EXACTLY these
// five (see AcxOfflineSuiteTest) instead of setting ignoreExitValue here:
// ignoreExitValue makes *new* problems just as silent as the known ones.
//
// ⚠️ The fixes (moving when completedStepIndex advances; checking the cancel
//   flag once more before reporting success; splitting PAUSED out of STEP_FAILED
//   and carrying task_id into the event detail) are FUNCTIONAL changes and were
//   deliberately NOT done while the owner has the code frozen.
// The offline suite self-checks the ac-lib we actually ship (its group 17 looks
// for a directory named 'ac-lib', while the shipped one is 'acx-lib' because
// that is the jar path AcxPlugin enumerates). Sync mirrors the real library into
// the build dir under the name the suite expects, so editing the shipped library
// is picked up on the next run instead of silently testing a stale copy.
//
// ac-lib/reference/ holds the DD originals as archive only. AcxPlugin enumerates
// /acx-lib/stable/ alone, so nothing under reference/ is ever materialised into
// the game config dir.
def acxFixture = tasks.register('acxFixture', Sync) {
    into layout.buildDirectory.dir('acx-fixture')
    from(file('src/main/resources/acx-lib')) { into 'ac-lib' }
}

tasks.register('acxOfflineTest', JavaExec) {
    group = 'verification'
    description = 'ACX offline self-check (209 checks, 5 known-red: TODO AC-B12 x2 + TODO AC-B18 x1 + TODO AC-B19 x1 + TODO AC-B20 x1) -- console copy only'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.dwinovo.numen.acx.test.AcxTestMain'
    dependsOn tasks.named('acxFixture')
    workingDir = layout.buildDirectory.dir('acx-fixture').get().asFile
    // ★ 2026-10-03：这个任务**不再是门禁**，只是给人看的那份控制台输出。
    //   真正的门禁是 JUnit 的 AcxOfflineSuiteTest（它把那 206 项接进测试报告，
    //   并且断言「失败数必须恰好等于已知的 2 项」）。
    //   为什么不再靠 ignoreExitValue：它会让**新问题也一样静默** ——
    //   而那正是我们这轮收口要消灭的东西。
    ignoreExitValue = true
}

// ★ 收口（2026-10-03）：把 206 项离线自检接成真正的门禁。
//   1) test 必须先有 fixture —— 否则 AcxOfflineSuiteTest 会在不存在的目录里找脚本库；
//   2) failOnNoDiscoveredTests 保持默认 true：**「没发现任何测试」必须报错**。
//      本模块以前一个 JUnit 测试都没有，:plugins:acx:test 因此一直是红的。
//      现在有了 AcxOfflineSuiteTest，这个问题才真正解决（而不是把它关掉）。
test {
    dependsOn tasks.named('acxFixture')
    useJUnitPlatform()
    testLogging {
        events 'passed', 'failed', 'skipped'
        showStandardStreams = false
    }
}

tasks.named('check') {
    dependsOn 'acxOfflineTest'
}

