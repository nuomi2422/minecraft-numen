plugins { id 'numen-plugin' }

processResources {
    def props = [
            version                       : project.version,
            license                       : license,
            neoforge_loader_version_range : neoforge_loader_version_range,
            neoforge_version              : neoforge_version,
            minecraft_version_range       : minecraft_version_range
    ]
    inputs.properties props
    filesMatching('META-INF/neoforge.mods.toml') {
        expand props
    }
}

dependencies {
    // ACX 本体（acx-api + acx-core 源码）在本模块内一起编译，无内嵌模块依赖。
    // 插件只经瘦 api jar 看 NUMEN（见 buildSrc 的 numen-plugin.gradle）。
    // gson 由 Minecraft 运行期自带的库提供，声明只为编译期解析。
    implementation 'com.google.code.gson:gson:2.10.1'

    // ★ 2026-10-03 收口：ACX 原来**一个 JUnit 测试都没有**（那 206 项是 main() 手工台），
    //   于是 :plugins:acx:test 因「有测试源码但一个都没发现」而一直失败。
    //   现在用 AcxOfflineSuiteTest 把那 206 项接成真门禁，所以必须引 JUnit。
    //   版本与其它模块一致（junit-bom 5.11.4），避免多套 JUnit 版本在同一个构建里打架。
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// ---------------------------------------------------------------------------
// ACX offline self-check (migrated 2026-10-03 from the ac-upgrade fork).
// acx/api + acx/core are Minecraft-free, so the suite runs on a plain JDK with
// only gson on the classpath - no gradle, no game, no devlaunch.
//
// NOTE（2026-10-06 更新）: 原 7 红 → 现 3 红。
//   AC-B19（取消迟到回执翻回成功）/ AC-B20（在飞动作记成 STEP_FAILED）/
//   AC-B21（无指纹绕过指纹门）/ AC-B22（会话层不重解析定义）**已修复转绿**，
//   测试断言逐字保留，只改了 AcxOfflineSuiteTest.KNOWN_RED 登记（7 → 3）。
//
// 当前剩余 3 红（都要先做设计决策，不是挪一行的事）:
//   · AC-B12 ×2 —— for 跨断点的参数快照 + 迭代游标（一整块状态机特性；见
//     AcxTestMain.ctrlSnapshot() 的 TODO 注释）。
//   · AC-B18 —— 恢复会重发已受理的动作。它与 PortToolAdapter 的「挂账 + resume
//     时探针」设计强耦合：适配器正是靠引擎重执行该步来查账（同参数命中旧账 →
//     查探针而不是重发）。修它必须先设计「已受理步」在运行记录里的表示，
//     不能只挪 markStepCompleted 的调用时机。实测 Fake.calls.count("gate") == 2。
//
// 历史读数（修 AC-B20 前）: live config/numen/monitor/acx.jsonl 2539 行里
//   STEP_FAILED|PAUSED = 53（在飞动作）/ STEP_FAILED|FAIL = 29（真失败）
//   ⇒ 按 kind 统计失败比真失败多 1.8 倍。修后 PAUSED 单发 STEP_PAUSED 且带 task_id。
//
// We keep the gate honest by asserting the failure count is EXACTLY the known
// three (see AcxOfflineSuiteTest) instead of setting ignoreExitValue here:
// ignoreExitValue makes *new* problems just as silent as the known ones.
// The offline suite self-checks the ac-lib we actually ship (its group 17 looks
// for a directory named 'ac-lib', while the shipped one is 'acx-lib' because
// that is the jar path AcxPlugin enumerates). Sync mirrors the real library into
// the build dir under the name the suite expects, so editing the shipped library
// is picked up on the next run instead of silently testing a stale copy.
//
// ac-lib/reference/ holds the DD originals as archive only. AcxPlugin enumerates
// /acx-lib/stable/ alone, so nothing under reference/ is ever materialised into
// the game config dir.
def acxFixture = tasks.register('acxFixture', Sync) {
    into layout.buildDirectory.dir('acx-fixture')
    from(file('src/main/resources/acx-lib')) { into 'ac-lib' }
}

tasks.register('acxOfflineTest', JavaExec) {
    group = 'verification'
    description = 'ACX offline self-check (217 checks, 3 known-red: TODO AC-B12 x2 + TODO AC-B18 x1; AC-B19/B20/B21/B22 fixed 2026-10-06) -- console copy only'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.dwinovo.numen.acx.test.AcxTestMain'
    dependsOn tasks.named('acxFixture')
    workingDir = layout.buildDirectory.dir('acx-fixture').get().asFile
    // ★ 2026-10-03：这个任务**不再是门禁**，只是给人看的那份控制台输出。
    //   真正的门禁是 JUnit 的 AcxOfflineSuiteTest（它把那 206 项接进测试报告，
    //   并且断言「失败数必须恰好等于已知的 2 项」）。
    //   为什么不再靠 ignoreExitValue：它会让**新问题也一样静默** ——
    //   而那正是我们这轮收口要消灭的东西。
    ignoreExitValue = true
}

// ★ 收口（2026-10-03）：把 206 项离线自检接成真正的门禁。
//   1) test 必须先有 fixture —— 否则 AcxOfflineSuiteTest 会在不存在的目录里找脚本库；
//   2) failOnNoDiscoveredTests 保持默认 true：**「没发现任何测试」必须报错**。
//      本模块以前一个 JUnit 测试都没有，:plugins:acx:test 因此一直是红的。
//      现在有了 AcxOfflineSuiteTest，这个问题才真正解决（而不是把它关掉）。
test {
    dependsOn tasks.named('acxFixture')
    useJUnitPlatform()
    testLogging {
        events 'passed', 'failed', 'skipped'
        showStandardStreams = false
    }
}

tasks.named('check') {
    dependsOn 'acxOfflineTest'
}

